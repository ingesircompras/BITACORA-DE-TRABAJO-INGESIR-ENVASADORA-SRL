<style>
  :root{
    color-scheme: dark;
    --bg:#101317; --card:#1a1f26; --text:#eceef1; --muted:#9aa0aa; --line:#2c3038;
    --accent:#8fb6dc; --accent-bg:#1c2e44; --cyan:#73d3ed; --brand:#5f85ab;
    --remoto:#c4b2ff; --remoto-bg:#302650;
    --pres:#8fdcb0; --pres-bg:#1d3a2b;
    --warn:#f3c56b; --warn-bg:#3d3017;
    --danger:#ff8a80;
    --radius:12px;
    --note-bg:#39321a; --note-line:#6b5a1f; --note-text:#f6e7b4; --note-muted:#c9b77a; --note-mine:#f3c56b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 0% -10%, rgba(115,211,237,.10), transparent 60%),radial-gradient(800px 600px at 110% 110%, rgba(95,133,171,.14), transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1440px;margin:0 auto;padding:16px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
  @media (max-width:1100px){ .layout{grid-template-columns:minmax(0,1fr)} .layout aside{order:-1} }
  header{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
  header{padding-bottom:16px;position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--brand) 45%,transparent)}
  header #logo{height:64px;width:auto;display:block;filter:drop-shadow(0 0 14px rgba(115,211,237,.18))}
  header .tit{flex:1;min-width:0}
  header #logo + .tit{padding-left:14px;border-left:1px solid var(--line)}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.08em;text-transform:uppercase}
  #fecha{font-size:13px;color:var(--muted)}
  @media (max-width:560px){ header{flex-wrap:wrap} header #logo{height:44px} header h1{font-size:14px;letter-spacing:.05em} .sync{display:none} .panel .form{grid-template-columns:1fr} }
  .sync{font-size:12px;color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary{color:#10162a}
  button:disabled{opacity:.6;cursor:wait}
  select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  textarea{resize:vertical;min-height:44px}
  select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .panel{border-top:2px solid var(--brand);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:18px}
  .form{display:grid;grid-template-columns:190px 200px 1fr auto;gap:10px;align-items:start}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;border-radius:0;padding:8px 6px;background:transparent}
  .seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
  .msg{font-size:13px;margin-top:8px;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--pres)}
  @media (max-width:760px){ .form{grid-template-columns:1fr 1fr} .form textarea,.form .send{grid-column:1/-1} }

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:13px;padding:5px 12px;border-radius:999px}
  .chip.on{background:var(--accent);color:#0d1a28;border-color:var(--accent);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
  .card:hover{border-color:var(--brand);transform:translateY(-1px)}
  .card{transition:border-color .15s,transform .15s}
  .card.stale{border-color:var(--warn)}
  .top{display:flex;gap:10px;align-items:flex-start}
  .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
  .who{flex:1;min-width:0}
  .who b{display:block;line-height:1.25;overflow-wrap:break-word}
  .who .sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
  .who span{font-size:12px;color:var(--muted)}
  .pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .pill.Remoto{background:var(--remoto-bg);color:var(--remoto)}
  .pill.Presencial{background:var(--pres-bg);color:var(--pres)}
  .estado{font-size:15px;white-space:pre-wrap;word-break:break-word}
  .estado.vacio{color:var(--muted);font-style:italic}
  .when{font-size:12px;color:var(--muted)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
  .mini{font-size:12px;padding:3px 9px;white-space:nowrap;flex-shrink:0}
  .when.warn{color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:6px;align-self:flex-start}

  h2{font-size:15px;font-weight:600;margin:26px 0 8px;display:flex;align-items:center;gap:10px}
  h2 select{width:auto;font-size:13px;padding:4px 8px;font-weight:400}
  .log{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .row{display:grid;grid-template-columns:54px 150px 1fr;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row .h{color:var(--muted);font-variant-numeric:tabular-nums}
  .row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .e{word-break:break-word}
  @media (max-width:560px){ .row{grid-template-columns:48px 1fr} .row .e{grid-column:2} }
  .empty{padding:18px 14px;color:var(--muted);font-size:14px}
  .loading{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}

  /* ---- Avisos ---- */
  aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
  @media (max-width:1100px){ aside{position:static;max-height:none} }
  .av-head{display:flex;align-items:center;gap:8px}
  .av-head h3{margin:0;font-size:15px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
  .badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
  .av-tabs{display:flex;gap:6px}
  .av-form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
  .av-form .de{font-size:12px;color:var(--muted)}
  .av-form .acts{display:flex;gap:8px;justify-content:flex-end}
  .note{background:var(--note-bg);color:var(--note-text);border:1px solid var(--note-line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;transform:rotate(var(--rot,0deg))}
  .note.mine{border:2px solid var(--note-mine)}
  .note .nh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--note-muted)}
  .note .nh b{color:var(--note-text);font-weight:600}
  .note .nm{font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .note .nf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--note-muted)}
  .note .nf .sp{flex:1}
  .note button{font-size:12px;padding:4px 10px;background:transparent;border-color:var(--note-line);color:var(--note-text)}
  .note button:hover{border-color:var(--note-text)}
  .tag-mine{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--note-mine);color:#2b2200;border-radius:4px;padding:1px 6px}
  .av-empty{font-size:13px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}

  .toast{position:fixed;right:18px;bottom:18px;max-width:340px;background:var(--note-bg);color:var(--note-text);border:2px solid var(--note-mine);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:50;cursor:pointer;animation:entra .25s ease-out}
  .toast small{display:block;color:var(--note-muted);margin-bottom:2px}

  /* ---- Mi usuario ---- */
  .yo{display:flex;align-items:center;gap:10px;min-height:40px}
  .yo .av{width:36px;height:36px;font-size:13px}
  .yo-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .yo-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button.link{background:none;border:0;padding:0;color:var(--accent);font-size:12px;text-align:left;cursor:pointer}
  button.link:hover{text-decoration:underline}
  .card.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .tag-vos{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--cyan);color:#062630;border-radius:4px;padding:1px 7px;vertical-align:2px}

  /* ---- Bienvenida / vincular PC ---- */
  .ov{position:fixed;inset:0;z-index:100;background:rgba(6,8,11,.78);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
  .ov-card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cyan);border-radius:16px;width:100%;max-width:640px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:entra .25s ease-out}
  .ov-card h2{margin:0 0 6px;font-size:22px}
  .ov-sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  .ov-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .ov-name{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--bg)}
  .ov-name:hover{border-color:var(--accent)}
  .ov-name .av{width:36px;height:36px;font-size:13px}
  .ov-name small{display:block;color:var(--muted);font-size:11px}
  .ov-who{display:flex;align-items:center;gap:12px;margin:14px 0 18px}
  .ov-who .av{width:52px;height:52px;font-size:18px}
  .ov-who b{font-size:18px;display:block}
  .ov-lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  #ovPin{font:inherit;font-size:26px;letter-spacing:.5em;text-align:center;width:100%;max-width:220px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  #ovPin:focus{outline:2px solid var(--accent)}
  #ovEntrar{display:block;margin-top:6px;min-width:220px;padding:11px}
  .ov-help{font-size:12px;color:var(--muted);margin:12px 0 0}
  .ov-foot{display:flex;justify-content:space-between;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
  .ov-foot .link{color:var(--muted)}
  @keyframes entra{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

      <label for="ovPin" class="ov-lbl">Ingresá tu PIN</label>
      <input id="ovPin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••">
      <div class="msg err" id="ovErr"></div>
      <button class="primary" id="ovEntrar">Entrar</button>
      <p class="ov-help">¿No tenés PIN? Pedíselo a quien administra el tablero.</p>
    </div>
    <div class="ov-foot">
      <button class="link" id="ovCancelar" hidden>Cancelar</button>
      <button class="link" id="ovSoloVer">Solo quiero mirar el tablero</button>
    </div>
  </div>
</div>

<script>
const COLORES = [
  ['#e7eefc','#2f5fd0'],['#e4f4ea','#1f7a4d'],['#fdeee6','#b4471c'],['#efeafc','#6a4bc4'],
  ['#fbe8f0','#a3305f'],['#e2f4f6','#0f6f7c'],['#fdf2dc','#8a5a00'],['#eef0f3','#4a5260']
];
/* ---- Sesión: esta PC vinculada a una persona ---- */
function leerSesion(){ try{ return JSON.parse(localStorage.getItem('tablero_sesion') || 'null'); }catch(e){ return null; } }
function guardarSesion(v){ SES = v; try{ v ? localStorage.setItem('tablero_sesion', JSON.stringify(v)) : localStorage.removeItem('tablero_sesion'); }catch(e){} }
let SES = leerSesion(), soloVer = false, ovNombre = '';

let enCurso = 0; /* guardados pendientes: mientras haya, el refresco automático no pisa la pantalla */
let DATA = null, filtroSector = '', modo = 'Presencial', filtroAvisos = 'mios', avisosVistos = null;
const $ = id => document.getElementById(id);

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iniciales(n){ return n.trim().split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase(); }
function colorSector(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return COLORES[h % COLORES.length]; }
function hhmm(d){ return d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}); }
function mismoDia(a,b){ return a.toDateString() === b.toDateString(); }

function hace(iso){
  if(!iso) return {txt:'Todavía no cargó nada', warn:true};
  const d = new Date(iso), now = new Date(), min = Math.round((now - d)/60000);
  if(!mismoDia(d, now)) return {txt:'Sin actualizar hoy · último ' + d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + hhmm(d), warn:true};
  const horas = min / 60;
  const txt = min < 1 ? 'Recién' : min < 60 ? `Hace ${min} min` : `Hace ${Math.floor(horas)} h ${min%60 ? (min%60)+' min' : ''}`;
  return {txt: txt.trim() + ' · ' + hhmm(d), warn: horas >= (DATA?.horasAlerta || 3)};
}

/* Lee la respuesta de Apps Script y explica el problema si no es JSON */
async function leerJSON(r){
  const txt = await r.text();
  if(txt.trim().startsWith('{')){
    const j = JSON.parse(txt);
    if(!j.ok){ const e = new Error(j.error); e.sesion = !!j.sesionInvalida; throw e; }
    return j;
  }
  if(/accounts\.google|ServiceLogin|Iniciar sesi|Sign in/i.test(txt))
    throw new Error('Apps Script pide iniciar sesión. En "Gestionar implementaciones", "Quién tiene acceso" tiene que ser "Cualquier usuario".');
  if(/doGet|doPost|Script function not found|No se ha encontrado la función/i.test(txt))
    throw new Error('Apps Script no encuentra doGet/doPost. Pegá el Code.gs completo, guardá y publicá una "Nueva versión".');
  if(r.status === 404)
    throw new Error('La URL de Apps Script no existe (404). Revisá la línea 10 de index.html: tiene que terminar en /exec.');
  throw new Error('La URL no devolvió datos. Revisá que en la línea 10 de index.html esté la URL que termina en /exec, publicada para "Cualquier usuario".');
}

async function post(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, token: SES?.token || ''})});
  try{
    const j = await leerJSON(r);
    if(j.equipo) guardarCache(j);
    return j;
  }catch(e){
    if(e.sesion){ guardarSesion(null); abrirBienvenida('Esta PC ya no está vinculada. Elegí tu nombre y poné tu PIN para volver a entrar.'); }
    throw e;
  }
}

function guardarCache(j){ try{ localStorage.setItem('tablero_cache', JSON.stringify(j)); }catch(e){} }
function leerCache(){ try{ return JSON.parse(localStorage.getItem('tablero_cache') || 'null'); }catch(e){ return null; } }

async function cargar(silencioso){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)){
    $('sync').textContent = 'Sin configurar';
    $('grid').innerHTML = `<div class="loading">Falta pegar la URL de Apps Script en la línea 10 de index.html.<br><small>Es la que termina en /exec (Implementar → Gestionar implementaciones).</small></div>`;
    return;
  }
  if(!silencioso) $('sync').textContent = 'Sincronizando…';
  try{
    const r = await fetch(API_URL + '?t=' + Date.now() + (SES ? '&token=' + encodeURIComponent(SES.token) : ''));
    const j = await leerJSON(r);
    guardarCache(j);
    if(SES && j.sesionValida === false){ guardarSesion(null); abrirBienvenida('Esta PC fue desvinculada. Elegí tu nombre y poné tu PIN para volver a entrar.'); }
    else if(SES && j.yo && j.yo !== SES.nombre) guardarSesion({...SES, nombre: j.yo});
    if(enCurso) return; DATA = j; pintar();
    $('sync').textContent = 'Actualizado ' + hhmm(new Date());
  }catch(e){
    $('sync').textContent = 'Sin conexión';
    if(!DATA) $('grid').innerHTML = `<div class="loading">No se pudo conectar con la planilla.<br><small>${esc(e.message)}</small></div>`;
    else if(!silencioso) toast('No se pudo actualizar', e.message);
  }
}

function pintar(){
  document.title = DATA.titulo; $('titulo').textContent = DATA.titulo;

  pintarYo();
  pintarBienvenida();
  const selLog = $('selLogPersona'), logSel = selLog.value;
  selLog.innerHTML = '<option value="">Todos</option>' +
    DATA.equipo.map(p => `<option ${p.nombre===logSel?'selected':''}>${esc(p.nombre)}</option>`).join('');

  const sectores = [...new Set(DATA.equipo.map(p => p.sector))].sort();
  if(filtroSector && !sectores.includes(filtroSector)) filtroSector = '';
  $('filtros').innerHTML = sectores.length > 1
    ? ['', ...sectores].map(s => `<button class="chip ${s===filtroSector?'on':''}" data-s="${esc(s)}">${s ? esc(s) : 'Todos'}</button>`).join('')
    : '';

  const lista = DATA.equipo.filter(p => !filtroSector || p.sector === filtroSector)
    .sort((a,b) => (b.nombre === yo()) - (a.nombre === yo()));
  $('grid').innerHTML = lista.map(p => {
    const [bg, fg] = colorSector(p.sector), h = hace(p.actualizado);
    const soyYo = p.nombre === yo();
    return `<div class="card ${h.warn && !soyYo ?'stale':''} ${soyYo?'me':''}" data-n="${esc(p.nombre)}">
      <div class="top">
        <div class="av" style="background:${bg};color:${fg}">${esc(iniciales(p.nombre))}</div>
        <div class="who"><b>${esc(p.nombre)} ${soyYo ? '<span class="tag-vos">Vos</span>' : ''}</b><div class="sub"><span>${esc(p.sector)}</span>${p.modalidad ? `<span class="pill ${esc(p.modalidad)}">${esc(p.modalidad)}</span>` : ''}</div></div>
      </div>
      <div class="estado ${p.estado?'':'vacio'}">${p.estado ? esc(p.estado) : 'Sin estado cargado'}</div>
      <div class="foot"><div class="when ${h.warn?'warn':''}">${esc(h.txt)}</div>${!soyYo ? '<button class="mini" data-aviso title="Dejarle un aviso">+ Aviso</button>' : ''}</div>
    </div>`;
  }).join('') || '<div class="empty">No hay personas en este sector.</div>';

  pintarLog();
  pintarAvisos();
  if(!$('txtEstado').value) precargar();
}

/* ---------------- Avisos ---------------- */
function yo(){ return SES?.nombre || ''; }

function avatar(nombre, sector){
  const [bg, fg] = colorSector(sector || '');
  return `<div class="av" style="background:${bg};color:${fg}">${esc(iniciales(nombre))}</div>`;
}
function pintarYo(){
  const b = $('yoBox');
  if(SES){
    const p = DATA?.equipo.find(x => x.nombre === SES.nombre);
    b.innerHTML = avatar(SES.nombre, p?.sector) + `<div class="yo-t"><b>${esc(SES.nombre)}</b><button class="link" data-yo="cambiar">Cambiar usuario</button></div>`;
  } else {
    b.innerHTML = '<button class="primary" data-yo="vincular" style="width:100%">Entrar con mi PIN</button>';
  }
}

/* ---- Bienvenida: elegir nombre + PIN ---- */
function abrirBienvenida(nota){
  ovNombre = ''; $('ov').hidden = false;
  $('ovNota').textContent = nota || 'Elegí tu nombre. Esta PC va a quedar vinculada a vos y no vas a tener que elegirlo de nuevo.';
  $('ovCancelar').hidden = !SES; $('ovSoloVer').hidden = !!SES;
  pintarBienvenida();
}
function cerrarBienvenida(){ $('ov').hidden = true; }
function pintarBienvenida(){
  if($('ov').hidden) return;
  $('ovPaso1').hidden = !!ovNombre; $('ovPaso2').hidden = !ovNombre;
  if(!ovNombre){
    if(DATA) $('ovNames').innerHTML = DATA.equipo.map(p =>
      `<button class="ov-name" data-n="${esc(p.nombre)}">${avatar(p.nombre, p.sector)}<span><b>${esc(p.nombre)}</b><small>${esc(p.sector)}</small></span></button>`).join('');
  } else {
    const p = DATA?.equipo.find(x => x.nombre === ovNombre);
    $('ovWho').innerHTML = avatar(ovNombre, p?.sector) + `<div><b>${esc(ovNombre)}</b><span style="color:var(--muted);font-size:13px">${esc(p?.sector || '')}</span></div>`;
  }
}
function descripcionPC(){
  const u = navigator.userAgent;
  const so = /Windows/.test(u) ? 'Windows' : /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Mac/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : 'Otro';
  const nav = /Edg\//.test(u) ? 'Edge' : /OPR\//.test(u) ? 'Opera' : /Firefox/.test(u) ? 'Firefox' : /Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : 'Navegador';
  return so + ' · ' + nav;
}
async function vincular(){
  const pin = $('ovPin').value.trim(), err = t => $('ovErr').textContent = t;
  if(!/^\d{4,6}$/.test(pin)){ err('El PIN son 4 números.'); $('ovPin').focus(); return; }
  const b = $('ovEntrar'); b.disabled = true; b.textContent = 'Verificando…'; err('');
  const lento = setTimeout(() => { b.textContent = 'Conectando con la planilla…'; }, 3500);
  const ctrl = new AbortController(), corte = setTimeout(() => ctrl.abort(), 30000);
  try{
    const r = await fetch(API_URL, {method:'POST', signal: ctrl.signal, headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({accion:'vincular', nombre: ovNombre, pin, dispositivo: descripcionPC(), tokenAnterior: SES?.token || ''})});
    const j = await leerJSON(r);
    guardarSesion({token: j.token, nombre: j.nombre});
    soloVer = false; avisosVistos = null;
    cerrarBienvenida(); $('ovPin').value = ''; if(DATA) pintar(); cargar(true);
    toast('¡Listo, ' + j.nombre.split(' ')[0] + '!', 'Esta PC quedó vinculada a vos.');
    try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
  }catch(e){
    err(e.name === 'AbortError' ? 'La planilla no respondió. Revisá tu conexión y probá de nuevo.' : e.message);
    $('ovPin').select();
  }
  finally{ clearTimeout(lento); clearTimeout(corte); b.disabled = false; b.textContent = 'Entrar'; }
}
function miSector(){ return DATA?.equipo.find(p => p.nombre === yo())?.sector || ''; }
function esParaMi(a){
  const n = yo(); if(!n || a.de === n) return false;
  return a.para === n || a.para === 'Todos' || a.para === 'Sector: ' + miSector();
}
function paraTexto(a){ return a.para === 'Todos' ? 'Todos' : a.para; }
function cuando(iso){
  if(!iso) return '';
  const d = new Date(iso), now = new Date(), min = Math.round((now - d)/60000);
  if(mismoDia(d, now)) return min < 1 ? 'recién' : min < 60 ? `hace ${min} min` : hhmm(d);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) + ' ' + hhmm(d);
}

function pintarAvisos(){
  const n = yo();
  $('avDe').textContent = n ? 'De: ' + n : 'Entrá con tu PIN para mandar avisos';
  const paraSel = $('avPara').value;
  const sectores = [...new Set(DATA.equipo.map(p => p.sector))].sort();
  $('avPara').innerHTML = '<option value="">¿Para quién?</option>' +
    '<optgroup label="Personas">' + DATA.equipo.filter(p => p.nombre !== n).map(p => `<option>${esc(p.nombre)}</option>`).join('') + '</optgroup>' +
    '<optgroup label="Grupos"><option value="Todos">Todos</option>' + sectores.map(s => `<option value="Sector: ${esc(s)}">Sector: ${esc(s)}</option>`).join('') + '</optgroup>';
  $('avPara').value = paraSel;

  const todos = DATA.avisos || [];
  const mios = todos.filter(esParaMi);
  const pendientes = mios.filter(a => a.estado === 'Pendiente').length;
  $('avBadge').hidden = !pendientes; $('avBadge').textContent = pendientes;
  document.title = (pendientes ? `(${pendientes}) ` : '') + DATA.titulo;

  document.querySelectorAll('#avTabs .chip').forEach(b => {
    b.classList.toggle('on', b.dataset.f === filtroAvisos);
    if(b.dataset.f === 'mios') b.textContent = 'Para mí' + (mios.length ? ` (${mios.length})` : '');
    if(b.dataset.f === 'todos') b.textContent = 'Todos' + (todos.length ? ` (${todos.length})` : '');
  });

  let lista = filtroAvisos === 'mios' ? todos.filter(a => esParaMi(a) || a.de === n) : todos;
  lista = lista.slice().sort((a,b) => (esParaMi(b) - esParaMi(a)) || (b.fecha > a.fecha ? 1 : -1));

  $('avLista').innerHTML = lista.length ? lista.map((a,i) => {
    const mio = esParaMi(a), puedeCerrar = mio || a.de === n;
    if(a.enviando) return `<div class="note ${mio?'mine':''}" style="opacity:.75"><div class="nh"><span><b>${esc(a.de)}</b> → <b>${esc(paraTexto(a))}</b></span><span>enviando…</span></div><div class="nm">${esc(a.mensaje)}</div></div>`;
    const est = a.estado === 'Visto' ? `Visto por ${esc(a.vistoPor)} ${cuando(a.fechaVisto)}` : 'Pendiente';
    return `<div class="note ${mio?'mine':''}" style="--rot:${[-0.6,0.5,-0.3,0.4][i%4]}deg" data-id="${esc(a.id)}">
      <div class="nh"><span><b>${esc(a.de)}</b> → <b>${esc(paraTexto(a))}</b></span><span>${cuando(a.fecha)}</span></div>
      <div class="nm">${esc(a.mensaje)}</div>
      <div class="nf">${mio ? '<span class="tag-mine">Para vos</span>' : ''}<span>${est}</span><span class="sp"></span>
        ${mio && a.estado === 'Pendiente' ? '<button data-act="Visto">Lo vi</button>' : ''}
        ${puedeCerrar ? `<button data-act="Hecho">${a.de === n && !mio ? 'Cerrar' : 'Hecho'}</button>` : ''}
      </div></div>`;
  }).join('') : `<div class="av-empty">${filtroAvisos === 'mios' ? (n ? 'No tenés avisos pendientes.' : 'Entrá con tu PIN para ver tus avisos.') : 'No hay avisos abiertos.'}</div>`;

  avisarNuevos(mios);
}

function avisarNuevos(mios){
  const ids = new Set(mios.map(a => a.id));
  if(avisosVistos === null){
    const pend = mios.filter(a => a.estado === 'Pendiente');
    if(pend.length) toast(pend.length === 1 ? `${pend[0].de} te dejó un aviso` : `Tenés ${pend.length} avisos pendientes`, pend.length === 1 ? pend[0].mensaje : 'Revisalos en el panel de avisos');
  } else {
    mios.filter(a => !avisosVistos.has(a.id) && a.estado === 'Pendiente').forEach(a => {
      toast(`${a.de} te dejó un aviso`, a.mensaje);
      try{ if('Notification' in window && Notification.permission === 'granted') new Notification('Aviso de ' + a.de, {body: a.mensaje}); }catch(e){}
    });
  }
  avisosVistos = ids;
}

function toast(titulo, texto){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<small>${esc(titulo)}</small>${esc(texto)}`;
  t.onclick = () => { t.remove(); filtroAvisos = 'mios'; pintarAvisos(); $('avisos').scrollIntoView({behavior:'smooth'}); };
  $('toastBox').innerHTML = ''; $('toastBox').appendChild(t);
  setTimeout(() => t.remove(), 12000);
}

function abrirFormAviso(abrir){
  $('avForm').hidden = !abrir; $('avErr').textContent = '';
  if(abrir) $('avMsg').focus();
}

async function enviarAviso(){
  const de = yo(), para = $('avPara').value, mensaje = $('avMsg').value.trim();
  const err = t => { $('avErr').textContent = t; };
  if(!de){ abrirBienvenida(); return; }
  if(!para){ err('Elegí para quién es el aviso.'); $('avPara').focus(); return; }
  if(!mensaje){ err('Escribí el mensaje.'); $('avMsg').focus(); return; }
  // Se muestra al instante y se guarda en segundo plano
  const tmp = {id:'tmp' + Date.now(), fecha:new Date().toISOString(), de, para, mensaje, estado:'Pendiente', vistoPor:'', fechaVisto:'', enviando:true};
  DATA.avisos = [tmp, ...(DATA.avisos || [])];
  $('avMsg').value = ''; $('avPara').value = ''; abrirFormAviso(false);
  filtroAvisos = 'mios'; pintar();
  enCurso++;
  try{
    const j = await post({accion:'aviso', de, para, mensaje});
    enCurso--; if(!enCurso) DATA = j; else DATA.avisos = DATA.avisos.map(a => a === tmp ? {...a, enviando:false} : a);
    pintar();
  }catch(e){
    enCurso--;
    DATA.avisos = DATA.avisos.filter(a => a !== tmp); pintar();
    abrirFormAviso(true); $('avPara').value = para; $('avMsg').value = mensaje;
    err('No se pudo enviar: ' + e.message);
  }
}

async function estadoAviso(id, estado, btn){
  if(!yo()){ abrirBienvenida(); return; }
  const antes = DATA.avisos;
  DATA.avisos = estado === 'Hecho'
    ? antes.filter(a => a.id !== id)
    : antes.map(a => a.id === id ? {...a, estado:'Visto', vistoPor:yo(), fechaVisto:new Date().toISOString()} : a);
  pintarAvisos();
  enCurso++;
  try{ const j = await post({accion:'avisoEstado', id, estado, quien: yo()}); enCurso--; if(!enCurso){ DATA = j; pintar(); } }
  catch(e){ enCurso--; DATA.avisos = antes; pintarAvisos(); toast('No se pudo guardar', e.message); }
}

function pintarLog(){
  const quien = $('selLogPersona').value;
  const filas = DATA.bitacora.filter(b => !quien || b.nombre === quien);
  $('log').innerHTML = filas.length
    ? filas.map(b => `<div class="row"><span class="h">${hhmm(new Date(b.ts))}</span><span class="n">${esc(b.nombre)}</span><span class="e">${esc(b.estado)}</span></div>`).join('')
    : '<div class="empty">Todavía no hay movimientos hoy.</div>';
}

function setModo(v){
  modo = v === 'Remoto' ? 'Remoto' : 'Presencial';
  document.querySelectorAll('#segModo button').forEach(b => b.classList.toggle('on', b.dataset.v === modo));
}

function precargar(){
  const n = yo(), p = DATA?.equipo.find(x => x.nombre === n);
  if(p && p.modalidad) setModo(p.modalidad);
}

function msg(t, tipo){ const m=$('msg'); m.textContent=t; m.className='msg '+(tipo||''); }

async function enviar(){
  const nombre = yo(), estado = $('txtEstado').value.trim();
  if(!nombre){ abrirBienvenida(); return; }
  if(!estado){ msg('Escribí en qué estás trabajando.','err'); $('txtEstado').focus(); return; }
  // Se actualiza la tarjeta al instante y se guarda en segundo plano
  const antes = {equipo: DATA.equipo, bitacora: DATA.bitacora}, ahora = new Date().toISOString();
  DATA.equipo = DATA.equipo.map(p => p.nombre === nombre ? {...p, estado, modalidad:modo, actualizado:ahora} : p);
  DATA.bitacora = [{ts:ahora, nombre, estado, modalidad:modo}, ...DATA.bitacora];
  $('txtEstado').value = ''; pintar(); msg('Guardando…');
  enCurso++;
  try{
    const j = await post({accion:'actualizar', nombre, modalidad:modo, estado});
    enCurso--; if(!enCurso){ DATA = j; pintar(); }
    msg('Listo, estado actualizado.','ok'); setTimeout(()=>msg(''), 3000);
    $('sync').textContent = 'Actualizado ' + hhmm(new Date());
  }catch(e){
    enCurso--; Object.assign(DATA, antes); pintar();
    $('txtEstado').value = estado; msg('No se pudo guardar: ' + e.message, 'err');
  }
}

/* Eventos */
$('btnEnviar').onclick = enviar;
$('btnRefresh').onclick = () => cargar();
$('txtEstado').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } });
$('txtEstado').addEventListener('input', () => msg(''));
$('yoBox').onclick = e => {
  const b = e.target.closest('[data-yo]'); if(!b) return;
  abrirBienvenida(b.dataset.yo === 'cambiar' ? 'Para cambiar de usuario, elegí el nombre y poné el PIN de esa persona.' : '');
};
$('ovNames').onclick = e => { const b = e.target.closest('.ov-name'); if(!b) return; ovNombre = b.dataset.n; $('ovErr').textContent = ''; pintarBienvenida(); $('ovPin').value = ''; $('ovPin').focus(); };
$('ovVolver').onclick = () => { ovNombre = ''; pintarBienvenida(); };
$('ovEntrar').onclick = vincular;
$('ovPin').addEventListener('keydown', e => { if(e.key === 'Enter') vincular(); });
$('ovPin').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); $('ovErr').textContent = ''; });
$('ovCancelar').onclick = cerrarBienvenida;
$('ovSoloVer').onclick = () => { soloVer = true; cerrarBienvenida(); };
$('btnNuevoAviso').onclick = () => abrirFormAviso($('avForm').hidden);
$('avCancelar').onclick = () => abrirFormAviso(false);
$('avEnviar').onclick = enviarAviso;
$('avMsg').addEventListener('input', () => $('avErr').textContent = '');
$('avPara').addEventListener('change', () => $('avErr').textContent = '');
$('avTabs').onclick = e => { const b = e.target.closest('.chip'); if(b){ filtroAvisos = b.dataset.f; pintarAvisos(); } };
$('avLista').onclick = e => {
  const b = e.target.closest('button[data-act]'); if(!b) return;
  estadoAviso(b.closest('.note').dataset.id, b.dataset.act, b);
};
$('selLogPersona').onchange = pintarLog;
$('segModo').onclick = e => { if(e.target.dataset.v) setModo(e.target.dataset.v); };
$('filtros').onclick = e => { const s = e.target.closest('.chip'); if(s){ filtroSector = s.dataset.s; pintar(); } };
$('grid').onclick = e => {
  const c = e.target.closest('.card'); if(!c) return;
  if(e.target.closest('[data-aviso]')){
    abrirFormAviso(true); $('avPara').value = c.dataset.n;
    $('avisos').scrollIntoView({behavior:'smooth', block:'nearest'}); $('avMsg').focus(); return;
  }
  $('selLogPersona').value = c.dataset.n; pintarLog();
  $('hLog').scrollIntoView({behavior:'smooth'});
};

$('fecha').textContent = (f => f.charAt(0).toUpperCase() + f.slice(1))(new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}));
const cache = leerCache();
if(cache){ DATA = cache; pintar(); $('sync').textContent = 'Sincronizando…'; }
cargar(!!cache);
if(!SES) abrirBienvenida();
setInterval(() => { if(!document.hidden) cargar(true); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) cargar(true); });
</script>
</body>
</html>
